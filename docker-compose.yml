name: mycloud

x-app-env: &app-env
  DB_HOST: relational-database-server
  DB_PORT: "1433"
  DB_NAME: ${DB_NAME:-studentdb}
  DB_USER: ${DB_USER:-cloud_app}
  DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.py}
  DB_TRUST_CERTIFICATE: ${DB_TRUST_CERTIFICATE:-yes}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  OIDC_REALM: ${OIDC_REALM:-521H0092-523H0065}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.py}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.py}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}

services:
  web-frontend-server1:
    image: mycloud-web:1.0.0
    build: ./web
    hostname: web-frontend-server1
    networks: [cloud-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-frontend-server2:
    image: mycloud-web:1.0.0
    hostname: web-frontend-server2
    networks: [cloud-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-gateway-proxy-server:
    image: nginx:1.28-alpine
    ports: ["80:80"]
    volumes: ["./proxy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks:
      cloud-net: {ipv4_address: 172.30.50.10}
    restart: unless-stopped
    depends_on:
      web-frontend-server1: {condition: service_healthy}
      web-frontend-server2: {condition: service_healthy}
      application-backend-server: {condition: service_healthy}
      auth-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  relational-database-server:
    image: mcr.microsoft.com/mssql/server:2022-CU22-ubuntu-22.04
    # SQL Server chỉ có image amd64; trên Mac Apple Silicon Docker chạy qua Rosetta.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/init-env.py}
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    networks: [cloud-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  database-init:
    image: mycloud-app:1.0.0
    command: ["python", "init_db.py"]
    environment:
      <<: *app-env
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/init-env.py}
    volumes: ["./db/init:/database:ro"]
    networks: [cloud-net]
    depends_on:
      relational-database-server: {condition: service_healthy}
    restart: "no"

  application-backend-server:
    image: mycloud-app:1.0.0
    build: ./app
    environment: *app-env
    networks:
      cloud-net: {ipv4_address: 172.30.50.20}
    depends_on:
      database-init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-env.py}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./auth/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    networks:
      cloud-net: {ipv4_address: 172.30.50.40}
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-init:
    image: mycloud-app:1.0.0
    command: ["python", "init_auth.py"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      OIDC_REALM: ${OIDC_REALM:-MSSV_PLACEHOLDER}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-env.py}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Run scripts/init-env.py}
    networks: [cloud-net]
    depends_on:
      authentication-identity-server: {condition: service_healthy}
    restart: "no"

  object-storage-server:
    image: mycloud-minio:source-2025-04-22
    build: ./storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.py}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    networks:
      cloud-net: {ipv4_address: 172.30.50.30}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  storage-init:
    image: mycloud-app:1.0.0
    command: ["python", "init_storage.py"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/init-env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/init-env.py}
    networks: [cloud-net]
    depends_on:
      object-storage-server: {condition: service_healthy}
    restart: "no"

  integration-check:
    profiles: ["tools"]
    image: mycloud-app:1.0.0
    command: ["python", "/checks/test-auth-storage.py"]
    environment:
      <<: *app-env
      PYTHONPATH: /app
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Run scripts/init-env.py}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init-env.py}
    volumes: ["./scripts:/checks:ro"]
    networks: [cloud-net]
    restart: "no"

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    ports: ["127.0.0.1:1053:53/tcp", "127.0.0.1:1053:53/udp"]
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./dns/named.conf.local:/etc/bind/named.conf.local:ro
      - ./dns/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net: {ipv4_address: 172.30.50.53}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "dig +time=2 +tries=1 @127.0.0.1 cloud.local SOA +short | grep -q ns.cloud.local"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitoring-node-exporter-server:
    image: prom/node-exporter:v1.9.1
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-http-exporter-server:
    image: prom/blackbox-exporter:v0.26.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes: ["./monitor/blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [cloud-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init-env.py}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      cloud-net: {ipv4_address: 172.30.50.50}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config: [{subnet: 172.30.50.0/24}]

volumes:
  mssql-data:
    name: mycloud_mssql-data
  keycloak-data:
    name: mycloud_keycloak-data
  minio-data:
    name: mycloud_minio-data
  prometheus-data:
    name: mycloud_prometheus-data
  grafana-data:
    name: mycloud_grafana-data
