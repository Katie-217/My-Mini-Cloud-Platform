global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["monitoring-prometheus-server:9090"]
  - job_name: node
    static_configs:
      - targets: ["monitoring-node-exporter-server:9100"]
  - job_name: blackbox
    static_configs:
      - targets: ["monitoring-http-exporter-server:9115"]
  - job_name: web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web-frontend-server1/health
          - http://web-frontend-server2/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: monitoring-http-exporter-server:9115
