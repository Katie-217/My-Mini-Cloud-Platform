worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    # Không log query string: callback OIDC có code/state trong URL.
    log_format cloud '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent upstream=$upstream_addr time=$request_time';
    access_log /var/log/nginx/access.log cloud;
    error_log /var/log/nginx/error.log warn;

    upstream web_pool {
        zone web_pool 64k;
        server web-frontend-server1:80 resolve max_fails=2 fail_timeout=5s;
        server web-frontend-server2:80 resolve max_fails=2 fail_timeout=5s;
    }
    upstream flask_backend {
        zone flask_backend 64k;
        server application-backend-server:8081 resolve;
    }
    upstream keycloak_backend {
        zone keycloak_backend 64k;
        server authentication-identity-server:8080 resolve;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 11m;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        add_header X-Content-Type-Options nosniff always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "proxy ready\n";
        }
        location = /api { return 308 /api/; }
        location /api/ {
            proxy_pass http://flask_backend/;
        }
        location = /student {
            proxy_pass http://flask_backend/student;
        }
        location = /student/ {
            proxy_pass http://flask_backend/student;
        }
        location = /auth { return 308 /auth/; }
        location /auth/ {
            # Keycloak đã listen /auth; giữ nguyên prefix.
            proxy_pass http://keycloak_backend;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }
        location / {
            proxy_pass http://web_pool;
            proxy_next_upstream error timeout http_502 http_504;
        }
    }
}
